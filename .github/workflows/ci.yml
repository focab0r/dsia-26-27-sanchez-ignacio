name: project-i-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uv-example:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install the project
        run: uv sync --locked --all-extras --dev --project proyectos/proyecto_i/

      - name: Run tests for ventas
        run: uv run --project proyectos/proyecto_i/ pytest proyectos/proyecto_i/tests/ventas_app/test.py

      - name: Run tests for project-i        
        run: uv run --project proyectos/proyecto_i/ pytest proyectos/proyecto_i/tests/proyecto_i/test.py
