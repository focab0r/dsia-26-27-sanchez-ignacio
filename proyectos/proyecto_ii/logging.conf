[loggers]
keys=root,proyecto_ii

[handlers]
keys=console,file

[formatters]
keys=simple

[logger_root]
level=WARNING
handlers=console

[logger_proyecto_ii]
level=INFO
handlers=file
qualname=proyecto_ii
propagate=1

[handler_console]
class=StreamHandler
formatter=simple
args=(sys.stderr,)

[handler_file]
class=FileHandler
formatter=simple
args=('%(logfilename)s', 'a', 'utf-8')

[formatter_simple]
format=%(asctime)s %(levelname)s: %(message)s