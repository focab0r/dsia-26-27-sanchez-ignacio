[project]
name = "proyecto-ii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "focab0r", email = "focab0r@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
proyecto-ii = "proyecto_ii:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath='.'
venv=".venv"
exclude=['.venv']
